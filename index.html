<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tone Studio</title>
    <meta name="description" content="AI-powered voice prototyping tool for designing and testing Jio's voice assistant persona" />
  </head>
  <body>
    <!-- Prevent flash of wrong theme on load -->
    <script>
      try {
        if (localStorage.getItem('voiceDesigner_colorMode') === 'Dark') {
          document.body.classList.add('dark');
        }
      } catch {}
    </script>
    <div id="root"></div>
    <!-- Unicorn Studio SDK v2.0.4 for WebGL orb animations (matches JSON v2.0.5) -->
    <script src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.0.4/dist/unicornStudio.umd.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
