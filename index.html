<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jio Voice Designer</title>
    <meta name="description" content="AI-powered voice prototyping tool for designing and testing Jio's voice assistant persona" />
  </head>
  <body>
    <!-- Prevent flash of wrong theme on load -->
    <script>
      try {
        if (localStorage.getItem('voiceDesigner_colorMode') === 'Dark') {
          document.body.classList.add('dark');
        }
      } catch {}
    </script>
    <div id="root"></div>
    <!-- Unicorn Studio SDK for WebGL orb animations -->
    <script src="https://cdn.unicorn.studio/v1.3.2/unicornStudio.umd.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
